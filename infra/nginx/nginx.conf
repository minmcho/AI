worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=20r/m;

    upstream go_api   { server api-go:8080; }
    upstream py_api   { server api-py:8000; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # Go API gateway (primary routing)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://go_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Search endpoint — stricter rate limit
        location /api/v1/search {
            limit_req zone=search burst=5 nodelay;
            proxy_pass http://go_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_valid 200 30s;
        }

        # Video streaming — large buffers, extended timeout
        location /api/v1/stream/ {
            proxy_pass http://go_api;
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Webhooks — direct to Go
        location /webhooks/ {
            proxy_pass http://go_api;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        # Python AI docs (internal only in production)
        location /docs {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://py_api;
        }

        location /health {
            proxy_pass http://go_api;
            access_log off;
        }
    }
}
