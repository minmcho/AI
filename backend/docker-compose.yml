version: "3.9"

# ─────────────────────────────────────────────────────────────
# VitalPath AI — Local Development Stack
# Services: API, Celery Worker, Celery Beat, Redis, PostgreSQL,
#           ChromaDB, Flower (monitoring)
# ─────────────────────────────────────────────────────────────

networks:
  vitalpath-net:
    driver: bridge

volumes:
  postgres-data:
  chroma-data:
  redis-data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitalpath
      POSTGRES_USER: vitalpath
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [vitalpath-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalpath"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [vitalpath-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB ────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: ""
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8001:8000"
    networks: [vitalpath-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── FastAPI / GraphQL ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vitalpath:secret@postgres:5432/vitalpath
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      DEBUG: "true"
    ports:
      - "8000:8000"
    networks: [vitalpath-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./app:/app/app   # Hot-reload in dev

  # ── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vitalpath:secret@postgres:5432/vitalpath
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    networks: [vitalpath-net]
    depends_on:
      - redis
      - postgres
      - chromadb

  # ── Celery Beat (scheduler) ─────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vitalpath:secret@postgres:5432/vitalpath
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    networks: [vitalpath-net]
    depends_on:
      - redis

  # ── Flower (Celery UI) ──────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    networks: [vitalpath-net]
    depends_on:
      - redis
