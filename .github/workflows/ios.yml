name: iOS

on:
  push:
    branches: [master, "claude/**"]
    paths: ["ios/**"]
  pull_request:
    paths: ["ios/**"]

jobs:
  build-test:
    name: Build · Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/VideoFeedApp.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -project ios/VideoFeedApp.xcodeproj \
            -scheme VideoFeedApp \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test
        run: |
          xcodebuild test \
            -project ios/VideoFeedApp.xcodeproj \
            -scheme VideoFeedApp \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  archive:
    name: Archive (master only)
    runs-on: macos-14
    needs: build-test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/VideoFeedApp.xcodeproj \
            -scheme VideoFeedApp \
            -archivePath build/VideoFeedApp.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFeedApp-archive
          path: build/VideoFeedApp.xcarchive
          retention-days: 14
