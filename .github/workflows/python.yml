name: Python

on:
  push:
    branches: [master, "claude/**"]
    paths: ["backend/python/**"]
  pull_request:
    paths: ["backend/python/**"]

jobs:
  test:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy . --ignore-missing-imports

      - name: Pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key
          GEMINI_API_KEY: test-key
          OPENCLAW_API_URL: http://localhost:3000
          OPENCLAW_TOKEN: test-token
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/python/coverage.xml
          flags: python

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: backend/python
          push: true
          tags: ghcr.io/${{ github.repository }}/api-py:${{ github.sha }},ghcr.io/${{ github.repository }}/api-py:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
