name: cargotrack

services:
  # ── Go API Gateway + GraphQL + WebSocket ────────────────────────────────────
  api-go:
    build:
      context: backend/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      PY_API_URL: http://api-py:8000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET}
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET}
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      api-py:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── FastAPI ML Service ───────────────────────────────────────────────────────
  api-py:
    build:
      context: backend/python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Claude — reasoning + prompt caching + extended thinking
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Voyage AI for embeddings (falls back to ANTHROPIC_API_KEY if unset)
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCLAW_API_URL: ${OPENCLAW_API_URL:-http://openclaw:3000}
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:-}
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET:-}
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis — real-time pub/sub + reasoning response cache ────────────────────
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── OpenClaw (local agent runner) ────────────────────────────────────────────
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "3000:3000"
    volumes:
      - ./openclaw/skills:/app/skills:ro
      - openclaw-data:/app/data
    environment:
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:-}
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    restart: unless-stopped

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-go
      - api-py
    restart: unless-stopped

volumes:
  redis-data:
  openclaw-data:
